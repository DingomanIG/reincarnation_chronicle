<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환생 연대기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f1ede2;
    --void:#201c1c;
    --void2:#2b2626;
    --gold:#e2100a;
    --gold-dim:#f65622;
    --line:#4a4040;
    --red:#f65622;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #2f2626 0%, var(--void) 55%);
    color:var(--ink);
    font-family:'Inter','Noto Sans KR',sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .stage{
    width:100%;
    max-width:520px;
  }
  .mark{
    text-align:center;
    letter-spacing:0.35em;
    font-size:11px;
    color:var(--gold-dim);
    margin-bottom:6px;
  }
  h1{
    text-align:center;
    font-size:28px;
    font-weight:400;
    margin:0 0 4px;
    color:var(--gold);
    letter-spacing:0.04em;
    font-family:'Anton','Noto Sans KR',sans-serif;
  }
  .sub{
    text-align:center;
    font-size:13px;
    color:#a8908a;
    margin-bottom:28px;
    font-style:italic;
  }
  .card{
    background:var(--void2);
    border:1px solid var(--line);
    border-radius:2px;
    padding:28px 24px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(201,162,75,0.15);
    pointer-events:none;
  }
  .step-title{
    font-size:18px;
    color:var(--ink);
    margin:0 0 18px;
    text-align:center;
    font-family:'Anton','Noto Sans KR',sans-serif;
    font-weight:400;
  }
  .choice-grid{
    display:grid;
    gap:10px;
  }
  .choice{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    padding:14px 16px;
    text-align:left;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .choice:hover, .choice:focus-visible{
    border-color:var(--gold);
    background:rgba(201,162,75,0.06);
    outline:none;
  }
  .choice .name{
    display:block;
    font-size:16px;
    color:var(--gold);
    margin-bottom:2px;
    font-family:'Anton','Noto Sans KR',sans-serif;
    font-weight:400;
  }
  .choice .desc{
    display:block;
    font-size:12.5px;
    color:#b09892;
  }
  .progress{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:20px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--line);
  }
  .dot.done{background:var(--gold-dim);}
  .dot.active{background:var(--gold);}

  /* Result */
  .portrait-slot{
    width:64px;height:64px;
    margin:0 auto 16px;
    border:1px solid var(--gold-dim);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    color:var(--gold);
    background:radial-gradient(circle at 35% 30%, #3a201d, #1c0f0e);
  }
  .race-name{
    text-align:center;
    font-size:22px;
    color:var(--gold);
    margin:0 0 2px;
    font-family:'Anton','Noto Sans KR',sans-serif;
    font-weight:400;
  }
  .race-tag{
    text-align:center;
    font-size:12px;
    color:#a8908a;
    margin-bottom:20px;
    letter-spacing:0.08em;
  }
  .life-lines{
    list-style:none;
    margin:0 0 22px;
    padding:0;
    border-top:1px solid var(--line);
  }
  .life-lines li{
    padding:11px 2px;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
    line-height:1.5;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .life-lines li .pt{
    margin-left:auto;
    flex-shrink:0;
    font-size:11px;
    color:var(--gold-dim);
    padding-top:2px;
    white-space:nowrap;
  }
  .total-points{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    margin-bottom:20px;
    border:1px solid var(--gold-dim);
    background:rgba(201,162,75,0.06);
    font-size:13px;
    color:var(--ink);
  }
  .total-points b{
    color:var(--gold);
    font-size:20px;
    font-weight:400;
    font-family:'Anton','Noto Sans KR',sans-serif;
  }
  .life-lines li .yr{
    color:var(--gold-dim);
    font-size:11px;
    min-width:52px;
    line-height:1.4;
    padding-top:2px;
  }
  .life-lines li:last-child{
    border-bottom:none;
    color:#e0b8ac;
  }
  .life-lines li:last-child .yr{
    color:var(--red);
  }
  .stat-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    font-size:12px;
    color:#a8908a;
    margin-bottom:20px;
    padding:10px;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
  }
  .stat-row span{
    text-align:center;
  }
  .stat-row span b{
    display:block;
    color:var(--ink);
    font-size:15px;
    font-weight:400;
    margin:2px 0;
  }
  .stat-row span .stat-tag{
    display:block;
    font-size:10.5px;
    color:var(--gold-dim);
    margin-top:2px;
    line-height:1.35;
    letter-spacing:0.01em;
  }
  .actions{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    background:transparent;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    font-family:inherit;
    font-size:14px;
    padding:13px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .btn:hover{background:rgba(201,162,75,0.08);border-color:var(--gold);}
  .btn.ghost{border-color:var(--line);color:#b09892;}
  .btn.ghost:hover{border-color:#555;color:var(--ink);}
  footer{
    text-align:center;
    font-size:11px;
    color:#5a4340;
    margin-top:22px;
    letter-spacing:0.05em;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="mark">環 生 年 代 記</div>
  <h1>환생 연대기</h1>
  <div class="sub">주사위를 굴려, 낯선 삶 하나를 살아본다</div>
  <div class="card" id="card"></div>
  <footer id="foot"></footer>
</div>

function genName(raceKey){
  const p = NAME_POOL[raceKey];
  if(["orc","goblin","ratkin","halfdemon","kobold","arachne"].includes(raceKey)){
    return rand(p.first); // 성씨 없이 이름만
  }
  return `${rand(p.first)} ${rand(p.last)}`;
}

function pickWeightedRace(){
  const total = RACES.reduce((s,r)=>s+r.weight,0);
  let roll = Math.random()*total;
  for(const r of RACES){
    if(roll < r.weight) return r;
    roll -= r.weight;
  }
  return RACES[0];
}

function hasBatchim(str){
  const ch = str.trim().slice(-1);
  const code = ch.charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return false;
  return (code % 28) !== 0;
}
function josaWaGwa(word){
  return hasBatchim(word) ? "과" : "와";
}

function genSpouseName(race, selfName){
  let name = genName(race.key);
  let tries = 0;
  while(name === selfName && tries < 10){
    name = genName(race.key);
    tries++;
  }
  return name;
}

function genChildrenLine(race, selfName){
  const [min,max] = race.childrenRange;
  const n = min + Math.floor(Math.random()*(max-min+1));
  const married = Math.random() < 0.75; // 75% 확률로 혼인

  if(!married){
    return rand(["끝내 혼인하지 않고 홀로 생을 지켰다.","평생 홀로 떠도는 삶을 택했다."]);
  }

  const spouse = genSpouseName(race, selfName);
  const j = josaWaGwa(spouse);

  if(n === 0){
    return `${spouse}${j} 혼인했으나 자식은 두지 못했다.`;
  }
  if(n === 1){
    return `${spouse}${j} 혼인해 슬하에 자식 하나를 두었다.`;
  }
  return `${spouse}${j} 혼인해 슬하에 자식 ${n}명을 두었다.`;
}

  // 중간 사건: 종족 수명에 따라 개수가 다름 (단명종 적게 / 장생종 많게)
  // 20% 종족 고유 / 30% 성향 / 50% 완전 랜덤
  const eventSlots = Math.max(0, state.race.middleCount - 1); // 자녀 줄 하나는 별도로 확보
  const middle = [];
  for(let n=0;n<eventSlots;n++){
    const r = Math.random();
    let picked;
    if(r < 0.20 && raceLines.length){
      picked = raceLines.shift();
    } else if(r < 0.50 && traitLines.length){
      const idx = Math.floor(Math.random()*traitLines.length);
      picked = traitLines.splice(idx,1)[0];
    } else {
      picked = rand(RANDOM_EVENTS);
    }
    if(!picked) picked = raceLines.shift() || rand(RANDOM_EVENTS);
    middle.push(picked);
  }

  // 자녀 줄은 한 줄로 몰아서, 중간 사건들 사이 랜덤 위치에 삽입
  const childrenLine = genChildrenLine(state.race, state.name);
  const insertAt = Math.floor(Math.random()*(middle.length+1));
  middle.splice(insertAt, 0, childrenLine);

  return [birthLine, jobLine, ...middle, deathLine];
}

function generateLifePoints(count){
  // [출생, 직업, 중간..., 사망] 구조에 맞춰 줄마다 기여 포인트를 부여
  const pts = [5]; // 출생
  pts.push(6 + Math.floor(Math.random()*5)); // 직업 시작: 6~10
  const middleCount = count - 3;
  for(let i=0;i<middleCount;i++){
    pts.push(6 + Math.floor(Math.random()*10)); // 중간 사건: 6~15
  }
  pts.push(12 + Math.floor(Math.random()*14)); // 사망: 12~25
  return pts;
}
function generateAges(count, race){
  // 종족 평균수명(lifespan)에 비례해 생애 전체 나이를 배분한다
  const { avg, variance } = race.lifespan;
  const deathAge = Math.max(5, Math.round(avg + (Math.random()*2-1)*variance));

  const [comeMin, comeMax] = race.comingOfAge;
  const jobAge = Math.max(1, Math.min(deathAge-1, comeMin + Math.floor(Math.random()*(comeMax-comeMin+1))));
  const ages = [0, jobAge]; // 출생, 직업 시작
  const middleCount = count - 3;
  const span = Math.max(1, deathAge - jobAge - 1);
  for(let i=1;i<=middleCount;i++){
    const t = i/(middleCount+1); // 0~1 사이 진행률
    const jitter = Math.round((Math.random()-0.5)*span*0.2);
    ages.push(Math.min(deathAge-1, jobAge + Math.round(span*t) + jitter));
  }
  ages.push(deathAge); // 사망
  return ages;
}

function screenResult(){
  const lines = generateLifeLines();
  const ages = generateAges(lines.length, state.race);
  const points = generateLifePoints(lines.length);
  const totalPoints = points.reduce((a,b)=>a+b,0);
  const birthYear = 100 + Math.floor(Math.random()*900);

  card.innerHTML = progressDots(3,4) + `
    <div class="portrait-slot">${state.race.icon}</div>
    <p class="race-name">${state.name}</p>
    <p class="race-tag">${state.gender} · ${state.race.name} · ${state.origin}</p>
    <p style="text-align:center;font-size:11px;color:#7a5f5a;margin:-14px 0 20px;font-style:italic;">${state.race.tag}</p>
    ${renderStatRow(state.stats)}
    <ul class="life-lines">
      ${lines.map((l,idx)=>`<li><span class="yr">${birthYear + ages[idx]}년<br>(${ages[idx]}세)</span><span>${l}</span><span class="pt">+${points[idx]}</span></li>`).join('')}
    </ul>
    <div class="total-points">
      <span>이번 생의 기여 포인트</span>
      <b>+${totalPoints}</b>
    </div>
    <div class="actions">
      <button class="btn" onclick="screenRace()">🎲 다시 환생</button>
      <button class="btn ghost" onclick="screenStart()">처음으로</button>
    </div>
  `;
  foot.textContent = "기여 포인트는 누적되면 로어포인트로 전환됩니다 (프로토타입: 미저장)";
}

/* ---------- 초기 ---------- */
screenStart();
</script>
